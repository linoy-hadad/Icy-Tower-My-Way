<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Game with Screen Scroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="backgroundVideo" autoplay muted loop playsinline>
        <source src="./assets/background-video.mp4" type="video/mp4">
    </video>
    <canvas id="gameCanvas"></canvas>
    <div id="startScreen">
        <div class="startScreenOverlay"></div>
        <div class="startScreenContent">
            <h1 class="startTitle">Icy Tower</h1>
            <p class="startSubtitle">Choose how you want to play.</p>
            <div class="startActions">
                <button class="menuBtn primary" id="startBtn">Start</button>
                <button class="menuBtn secondary" id="startCameraBtn">Start with Camera</button>
            </div>
            <p id="cameraStatusMessage" class="cameraStatusMessage"></p>
        </div>
    </div>
    <div id="cameraHud">
        <video id="cameraPreview" autoplay muted playsinline></video>
        <p id="cameraHudLabel">Camera Mode</p>
        <div id="cameraHudRules">
            <p>Both hands up: Jump</p>
            <p>Left hand up: Move left</p>
            <p>Right hand up: Move right</p>
        </div>
    </div>
    <div id="touchControls">
        <div class="touchMoveGroup">
            <button class="touchBtn" id="touchLeftBtn" aria-label="Move left">Left</button>
            <button class="touchBtn" id="touchRightBtn" aria-label="Move right">Right</button>
        </div>
            <button class="touchBtn jumpBtn" id="touchJumpBtn" aria-label="Jump">Jump</button>
    </div>
    <div id="recordToast">You crushed your best score!</div>
    <div id="gameOverScreen">
        <div class="gameOverModal">
            <div class="gameOverContent">
                <h1 class="gameOverTitle">Game Over!</h1>
                <p id="gameOverMessage" class="gameOverReason">You hit an enemy!</p>
                <div class="scoreboardSection">
                    <div class="scoreboardInner">
                        <h2>Best Scores</h2>
                        <ol id="bestScoresList"></ol>
                    </div>
                </div>
                <div class="gameOverActions">
                    <button class="playAgainBtn" id="playAgainBtn">Play Again</button>
                    <button class="playAgainBtn secondaryBtn" id="backToMenuBtn">Back to Menu</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const BEST_SCORES_KEY = 'icyTowerBestScores';
        const PLAYER_SPRITE_WIDTH = 56;
        const PLAYER_SPRITE_HEIGHT = 56;
        const PLAYER_SPRITE_VERTICAL_OFFSET = 10;
        const ENEMY_SPRITE_SIZE = 42;
        const BULLET_SPRITE_SIZE = 32;
        const MOVING_PLATFORM_CHANCE = 0.06;
        const MOVING_PLATFORM_AMPLITUDE = 24;
        const MOVING_PLATFORM_SPEED = 0.025;
        const PLATFORM_FALL_DELAY_FRAMES = 240;
        const FALLING_PLATFORM_GRAVITY = 0.9;
        const INITIAL_PLATFORM_FALL_VELOCITY = 2;
        const STAR_PLATFORM_CHANCE = 0.05;
        const POWER_UP_DURATION_MS = 6000;
        const STAR_SIZE = 44;
        const SPRING_PLATFORM_CHANCE = 0.05;
        const SPRING_SIZE = 52;
        const DIAMOND_PLATFORM_CHANCE = 0.06;
        const DIAMOND_SIZE = 42;
        const DIAMOND_TARGET_COUNT = 5;
        const DIAMOND_SUPER_JUMP_DURATION_MS = 1000;
        const CRACKING_PLATFORM_CHANCE = 0.06;
        const CRACKING_PLATFORM_DURATION_MS = 750;
        const MEDIAPIPE_WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm';
        const HAND_LANDMARKER_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
        const HAND_RAISE_THRESHOLD = 0.58;
        const HAND_DIRECTION_CENTER_MIN = 0.4;
        const HAND_DIRECTION_CENTER_MAX = 0.6;
        const CAMERA_MOVE_ACCELERATION = 0.35;
        const CAMERA_MOVE_MAX_SPEED = 2.5;
        const TOUCH_MOVE_ACCELERATION = 0.55;
        const TOUCH_MOVE_MAX_SPEED = 3.5;
        const STORM_SNOWFLAKE_MIN_DELAY_MS = 25000;
        const STORM_SNOWFLAKE_EXTRA_DELAY_MS = 20000;
        const STORM_SNOWFLAKE_SIZE = 92;
        const STORM_SNOWFLAKE_SPEED_Y = 3.6;
        const STORM_SNOWFLAKE_ZIGZAG_AMPLITUDE = 230;
        const STORM_SNOWFLAKE_ZIGZAG_SPEED = 0.028;

        const TARGET_FPS = 60;
        const FRAME_TIME = 1000 / TARGET_FPS;

        // Game settings tuned for 30 updates/sec
        const gravity = 0.5;
        const friction = 0.8;
        const baseJump = -10;
        const BOOSTED_JUMP = baseJump * 2;

        // Player
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            width: 20,
            height: 20,
            speed: 5,
            velX: 0,
            velY: 0,
            jumping: false
        };

        // Platforms
        let platforms = [];
        let enemies = [];
        let bullets = [];
        let stars = [];
        let springs = [];
        let diamonds = [];
        let sceneInitialized = false;
        let score = 0;
        let diamondCount = 0;
        let lastLandedPlatform = null;
        let currentPlatform = null;
        let platformCounter = 0;
        let gameState = "menu"; // "menu", "playing" or "gameOver"
        let playerPoweredUp = false;
        let powerUpEndTime = 0;
        let playerHasBoostedJump = false;
        let currentControlMode = 'menu';
        let handLandmarker = null;
        let cameraStream = null;
        let cameraAnimationFrameId = 0;
        let lastCameraVideoTime = -1;
        let cameraModeStarting = false;
        let fallingStormSnowflake = null;
        let nextStormSnowflakeTime = 0;
        let hasShownRecordToastThisRun = false;
        let diamondBoostActive = false;
        let diamondBoostStartTime = 0;
        let diamondBoostEndTime = 0;
        let pendingGameOverSoundTimeout = 0;
        let recordCheerTimeout = 0;
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
        let handControlState = {
            leftRaised: false,
            rightRaised: false,
            bothRaised: false,
            jumpDirection: 0
        };
        let touchInputState = {
            left: false,
            right: false
        };
        const playerFrontImage = new Image();
        const playerBackImage = new Image();
        const playerStarFrontImage = new Image();
        const playerStarBackImage = new Image();
        const platformImage = new Image();
        const enemyNoGunImage = new Image();
        const enemyWithGunImage = new Image();
        const bulletImage = new Image();
        const starPowerupImage = new Image();
        const springPowerupImage = new Image();
        const diamondPowerupImage = new Image();
        const stormSnowflakeImage = new Image();
        const backgroundVideo = document.getElementById('backgroundVideo');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const cameraStatusMessage = document.getElementById('cameraStatusMessage');
        const cameraHud = document.getElementById('cameraHud');
        const cameraPreview = document.getElementById('cameraPreview');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const touchControls = document.getElementById('touchControls');
        const touchLeftBtn = document.getElementById('touchLeftBtn');
        const touchRightBtn = document.getElementById('touchRightBtn');
        const touchJumpBtn = document.getElementById('touchJumpBtn');
        const recordToast = document.getElementById('recordToast');
        const RECORD_TOAST_DURATION_MS = 2000;
        const jumpSound = new Audio('./assets/jump.mp3');
        const landingSound = new Audio('./assets/landing.wav');
        const diamondPickupSound = new Audio('./assets/item-pickup.mp3');
        const gameOverSound = new Audio('./assets/gameover.ogg');
        const enemyHitSound = new Audio('./assets/enemy-hit.mp3');
        const starPickupSound = new Audio('./assets/star-pickup.wav');
        const woohooSound = new Audio('./assets/woohoo.mp3');
        const recordCheerSound = new Audio('./assets/record-cheer.mp3');
        const backgroundMusic = new Audio('./assets/background-video.mp4');
        playerFrontImage.src = './assets/player-front.png';
        playerBackImage.src = './assets/player-back.png';
        playerStarFrontImage.src = './assets/player-star-front.png';
        playerStarBackImage.src = './assets/player-star-back.png';
        platformImage.src = './assets/platform.png';
        enemyNoGunImage.src = './assets/enemy-no-gun.png';
        enemyWithGunImage.src = './assets/enemy-with-gun.png';
        bulletImage.src = './assets/bullet.png';
        starPowerupImage.src = './assets/star-powerup.png';
        springPowerupImage.src = './assets/spring-powerup.png';
        diamondPowerupImage.src = './assets/diamond-powerup.png';
        stormSnowflakeImage.src = './assets/storm-snowflake.png';
        jumpSound.preload = 'auto';
        landingSound.preload = 'auto';
        diamondPickupSound.preload = 'auto';
        gameOverSound.preload = 'auto';
        enemyHitSound.preload = 'auto';
        starPickupSound.preload = 'auto';
        woohooSound.preload = 'auto';
        recordCheerSound.preload = 'auto';
        backgroundMusic.preload = 'auto';
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.22;
        jumpSound.volume = 0.5;
        landingSound.volume = 0.45;
        diamondPickupSound.volume = 0.45;
        gameOverSound.volume = 0.5;
        enemyHitSound.volume = 0.55;
        starPickupSound.volume = 0.45;
        woohooSound.volume = 0.55;
        recordCheerSound.volume = 0.34;

        applyMobilePerformanceSettings();

        function loadBestScores() {
            const rawScores = sessionStorage.getItem(BEST_SCORES_KEY);

            if (!rawScores) {
                return [];
            }

            try {
                const parsedScores = JSON.parse(rawScores);
                if (!Array.isArray(parsedScores)) {
                    return [];
                }

                return parsedScores
                    .map(Number)
                    .filter(Number.isFinite)
                    .sort((a, b) => b - a)
                    .slice(0, 10);
            } catch (error) {
                return [];
            }
        }

        function saveBestScores(scores) {
            sessionStorage.setItem(BEST_SCORES_KEY, JSON.stringify(scores));
        }

        function addScoreToBestScores(newScore) {
            const bestScores = loadBestScores();
            const previousBestScore = bestScores.length > 0 ? Math.max(...bestScores) : 0;
            bestScores.push(newScore);
            const uniqueScores = [...new Set(bestScores)].sort((a, b) => b - a);
            const topTenScores = uniqueScores.slice(0, 10);
            saveBestScores(topTenScores);
            return {
                bestScores: topTenScores,
                isNewRecord: newScore > 0 && newScore > previousBestScore
            };
        }

        function renderBestScores(scores) {
            const bestScoresList = document.getElementById('bestScoresList');
            const crownIcon = String.fromCodePoint(0x1F451);
            const visibleScores = scores.filter(savedScore => savedScore > 0);
            bestScoresList.innerHTML = '';

            if (visibleScores.length === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.textContent = 'No scores yet, start playing!';
                bestScoresList.appendChild(emptyItem);
                return;
            }

            visibleScores.forEach((savedScore, index) => {
                const scoreItem = document.createElement('li');

                if (index === 0) {
                    scoreItem.setAttribute('aria-label', `Best score ${savedScore}`);
                    scoreItem.textContent = `${savedScore} ${crownIcon}`;
                } else {
                    scoreItem.textContent = `${savedScore}`;
                }

                bestScoresList.appendChild(scoreItem);
            });
        }

        function showRecordToast() {
            recordToast.classList.remove('show');
            void recordToast.offsetWidth;
            recordToast.classList.add('show');
            playSound(recordCheerSound);

            if (recordCheerTimeout) {
                clearTimeout(recordCheerTimeout);
            }

            recordCheerTimeout = window.setTimeout(() => {
                recordCheerSound.pause();
                recordCheerSound.currentTime = 0;
                recordCheerTimeout = 0;
            }, RECORD_TOAST_DURATION_MS);
        }

        function playSound(audio, options = {}) {
            if (!audio) {
                return;
            }

            const shouldRestart = options.restart ?? true;

            try {
                if (shouldRestart) {
                    audio.pause();
                    audio.currentTime = 0;
                }

                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            } catch (error) {
                // Ignore playback failures caused by browser policies.
            }
        }

        function startBackgroundMusic() {
            if (isTouchDevice && document.body.classList.contains('mobile-performance')) {
                return;
            }

            backgroundMusic.currentTime = 0;
            playSound(backgroundMusic, { restart: false });
        }

        function stopBackgroundMusic() {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }

        function setCameraStatus(message = '') {
            cameraStatusMessage.textContent = message;
        }

        function scheduleNextStormSnowflake() {
            nextStormSnowflakeTime = Date.now() + STORM_SNOWFLAKE_MIN_DELAY_MS + (Math.random() * STORM_SNOWFLAKE_EXTRA_DELAY_MS);
        }

        function createStormSnowflake() {
            const startX = (canvas.width / 2) - (STORM_SNOWFLAKE_SIZE / 2);

            return {
                baseX: startX,
                x: startX,
                y: -STORM_SNOWFLAKE_SIZE,
                width: STORM_SNOWFLAKE_SIZE,
                height: STORM_SNOWFLAKE_SIZE,
                zigzagPhase: Math.random() * Math.PI * 2
            };
        }

        function updateTouchControlsVisibility() {
            const shouldShow = isTouchDevice && gameState === 'playing' && !document.getElementById('gameOverScreen').classList.contains('show');
            touchControls.classList.toggle('show', shouldShow);
            document.body.classList.toggle('touch-device', isTouchDevice);
        }

        function resetTouchInputState() {
            touchInputState.left = false;
            touchInputState.right = false;
        }

        function resetHandControlState() {
            handControlState.leftRaised = false;
            handControlState.rightRaised = false;
            handControlState.bothRaised = false;
            handControlState.jumpDirection = 0;
        }

        function showStartScreen() {
            startScreen.classList.remove('hidden');
            updateTouchControlsVisibility();
        }

        function hideStartScreen() {
            startScreen.classList.add('hidden');
            updateTouchControlsVisibility();
        }

        function applyMobilePerformanceSettings() {
            if (!isTouchDevice) {
                return;
            }

            backgroundVideo.pause();
            backgroundVideo.style.display = 'none';
            document.body.classList.add('mobile-performance');
        }

        async function initializeHandLandmarker() {
            if (handLandmarker) {
                return handLandmarker;
            }

            const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest');
            const filesetResolver = await vision.FilesetResolver.forVisionTasks(MEDIAPIPE_WASM_URL);
            handLandmarker = await vision.HandLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: HAND_LANDMARKER_MODEL_URL,
                    delegate: 'GPU'
                },
                runningMode: 'VIDEO',
                numHands: 2
            });

            return handLandmarker;
        }

        async function startCameraStream() {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 960 },
                    height: { ideal: 540 }
                },
                audio: false
            });

            cameraPreview.srcObject = cameraStream;
            await cameraPreview.play();
        }

        function stopCameraMode() {
            if (cameraAnimationFrameId) {
                cancelAnimationFrame(cameraAnimationFrameId);
                cameraAnimationFrameId = 0;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            cameraPreview.srcObject = null;
            cameraHud.classList.remove('show');
            lastCameraVideoTime = -1;
            cameraModeStarting = false;
            resetHandControlState();
            resetTouchInputState();
        }

        function triggerJump(source = 'keyboard') {
            if (gameState !== 'playing' || player.jumping) {
                return;
            }

            if (source !== 'camera' && currentControlMode === 'camera' && handControlState.bothRaised) {
                return;
            }

            const jumpStrength = playerHasBoostedJump ? BOOSTED_JUMP : baseJump;
            const isBoostedJump = playerHasBoostedJump;
            player.jumping = true;
            player.velY = jumpStrength - Math.abs(player.velX);
            playerHasBoostedJump = false;
            playSound(jumpSound);
            if (isBoostedJump) {
                playSound(woohooSound);
            }
        }

        function processHandResults(results) {
            const raisedHands = [];

            results.landmarks.forEach((landmarks, index) => {
                const wrist = landmarks[0];
                const middleMcp = landmarks[9];
                const palmY = (wrist.y + middleMcp.y) / 2;
                const palmX = (wrist.x + middleMcp.x) / 2;
                const displayPalmX = 1 - palmX;
                const isRaised = palmY < HAND_RAISE_THRESHOLD;

                if (isRaised) {
                    raisedHands.push(displayPalmX);
                }
            });

            if (raisedHands.length >= 2) {
                const sortedHands = raisedHands.sort((a, b) => a - b);
                const handsCenterX = (sortedHands[0] + sortedHands[1]) / 2;

                handControlState.leftRaised = true;
                handControlState.rightRaised = true;
                handControlState.bothRaised = true;

                if (handsCenterX < HAND_DIRECTION_CENTER_MIN) {
                    handControlState.jumpDirection = -1;
                } else if (handsCenterX > HAND_DIRECTION_CENTER_MAX) {
                    handControlState.jumpDirection = 1;
                } else {
                    handControlState.jumpDirection = 0;
                }
            } else if (raisedHands.length === 1) {
                const handX = raisedHands[0];
                handControlState.leftRaised = handX < 0.5;
                handControlState.rightRaised = handX >= 0.5;
                handControlState.bothRaised = false;
                handControlState.jumpDirection = 0;
            } else {
                handControlState.leftRaised = false;
                handControlState.rightRaised = false;
                handControlState.bothRaised = false;
                handControlState.jumpDirection = 0;
            }
        }

        async function detectHandsFrame() {
            if (!handLandmarker || !cameraPreview.srcObject || gameState === 'menu') {
                return;
            }

            if (cameraPreview.readyState >= 2 && cameraPreview.currentTime !== lastCameraVideoTime) {
                lastCameraVideoTime = cameraPreview.currentTime;
                const results = handLandmarker.detectForVideo(cameraPreview, performance.now());
                processHandResults(results);
            }

            cameraAnimationFrameId = requestAnimationFrame(detectHandsFrame);
        }

        function getResolvedMovementInput() {
            const keyboardInput = {
                left: Boolean(keys[37]),
                right: Boolean(keys[39]),
                cameraControlled: false,
                touchControlled: false
            };
            const touchInput = {
                left: touchInputState.left,
                right: touchInputState.right,
                cameraControlled: false,
                touchControlled: true
            };

            if (currentControlMode !== 'camera') {
                return touchInput.left || touchInput.right ? touchInput : keyboardInput;
            }

            const hasHandOverride = handControlState.leftRaised || handControlState.rightRaised || handControlState.bothRaised;
            if (!hasHandOverride) {
                return touchInput.left || touchInput.right ? touchInput : keyboardInput;
            }

            if (handControlState.bothRaised) {
                return {
                    left: handControlState.jumpDirection < 0,
                    right: handControlState.jumpDirection > 0,
                    cameraControlled: true,
                    touchControlled: false
                };
            }

            return {
                left: handControlState.leftRaised,
                right: handControlState.rightRaised,
                cameraControlled: true,
                touchControlled: false
            };
        }

        function startGameplay(mode) {
            if (mode === 'keyboard') {
                stopCameraMode();
            }

            currentControlMode = mode;
            hideStartScreen();
            setCameraStatus('');
            resetGame();
            startBackgroundMusic();
            gameState = 'playing';
            updateTouchControlsVisibility();
        }

        async function startWithCameraMode() {
            if (cameraModeStarting) {
                return;
            }

            cameraModeStarting = true;
            setCameraStatus('Starting camera...');

            try {
                if (!navigator.mediaDevices?.getUserMedia) {
                    throw new Error('This browser does not support webcam access.');
                }

                await initializeHandLandmarker();
                await startCameraStream();
                cameraHud.classList.add('show');
                currentControlMode = 'camera';
                hideStartScreen();
                setCameraStatus('');
                resetGame();
                startBackgroundMusic();
                gameState = 'playing';
                updateTouchControlsVisibility();
                cameraAnimationFrameId = requestAnimationFrame(detectHandsFrame);
            } catch (error) {
                stopCameraMode();
                showStartScreen();
                setCameraStatus(error.message || 'Could not start the camera. You can still use Start.');
            } finally {
                cameraModeStarting = false;
            }
        }

        function backToMenu() {
            resetGame();
            gameState = 'menu';
            currentControlMode = 'menu';
            stopCameraMode();
            stopBackgroundMusic();
            showStartScreen();
            setCameraStatus('');
            updateTouchControlsVisibility();
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        // Enemy helper functions
        function getRandomEnemyChance() {
            return Math.random() < 0.05; // 5% chance
        }

        function getEnemyType() {
            const rand = Math.random();
            if (rand < 0.25) return 1;     // 25% Type1 (temporarily reduced for testing)
            if (rand < 0.5) return 2;      // 25% Type2 (temporarily reduced for testing)
            return 3;                       // 50% Type3 (temporarily increased for testing)
        }

        function createEnemy(platform) {
            const size = 12;
            return {
                x: platform.x + platform.width / 2 - size / 2,
                y: platform.y - size - 5,
                width: size,
                height: size,
                type: getEnemyType(),
                platformId: platform.id,
                direction: Math.random() > 0.5 ? 1 : -1,
                speed: 2,
                shootTimer: 59, // Initialize high so it shoots immediately
                shootInterval: 60 // frames between shots for Type3 (1 second at 60 FPS)
            };
        }

        function createBullet(fromX, fromY, toX, toY) {
            const bulletSpeed = 4;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const velX = (dx / distance) * bulletSpeed;
            const velY = (dy / distance) * bulletSpeed;

            return {
                x: fromX,
                y: fromY,
                velX,
                velY,
                width: 10,
                height: 10
            };
        }

        function createStar(platform) {
            return {
                x: platform.x + platform.width / 2 - STAR_SIZE / 2,
                y: platform.y - STAR_SIZE - 18,
                width: STAR_SIZE,
                height: STAR_SIZE,
                platformId: platform.id
            };
        }

        function createSpring(platform) {
            return {
                x: platform.x + platform.width / 2 - SPRING_SIZE / 2,
                y: platform.y - SPRING_SIZE - 18,
                width: SPRING_SIZE,
                height: SPRING_SIZE,
                platformId: platform.id
            };
        }

        function createDiamond(platform) {
            const horizontalPadding = Math.max(8, DIAMOND_SIZE * 0.2);
            const availableWidth = Math.max(0, platform.width - DIAMOND_SIZE - (horizontalPadding * 2));
            const offsetRatio = Math.random();

            return {
                x: platform.x + horizontalPadding + (availableWidth * offsetRatio),
                y: platform.y - DIAMOND_SIZE - 24,
                width: DIAMOND_SIZE,
                height: DIAMOND_SIZE,
                platformId: platform.id,
                offsetRatio
            };
        }

        function getDiamondSuperJumpVelocity() {
            const targetHeight = getPlatformVerticalGap() * 5;
            const speed = Math.sqrt(2 * gravity * targetHeight);
            return -clamp(speed, 18, 26);
        }

        function getPlatformWidth() {
            return clamp(canvas.width * 0.18, 110, 220);
        }

        function getRandomPlatformWidth() {
            const baseWidth = getPlatformWidth();
            const variedWidth = baseWidth * (0.7 + Math.random() * 0.6);
            return clamp(variedWidth, 90, 260);
        }

        function getPlatformHeight() {
            return clamp(canvas.height * 0.018, 10, 18);
        }

        function getPlatformCount() {
            return Math.max(9, Math.floor(canvas.height / 120));
        }

        function getPlatformVerticalGap() {
            return clamp(canvas.height * 0.14, 90, 130);
        }

        function getPlatformHorizontalPadding() {
            return clamp(canvas.width * 0.08, 30, 120);
        }

        function getMaxHorizontalStep() {
            return clamp(canvas.width * 0.22, 130, 260);
        }

        function createPlatform(x, y, width = getRandomPlatformWidth(), options = {}) {
            const isMoving = options.isMoving ?? (Math.random() < MOVING_PLATFORM_CHANCE);

            return {
                x: clamp(x, 0, canvas.width - width),
                y,
                baseY: y,
                previousY: y,
                width,
                height: getPlatformHeight(),
                timeOnPlatform: 0,
                isFalling: false,
                fallVelocity: 0,
                isMoving,
                isCrackingPlatform: !isMoving && (options.isCrackingPlatform ?? (Math.random() < CRACKING_PLATFORM_CHANCE)),
                crackStarted: false,
                crackStartTime: 0,
                crackProgress: 0,
                moveAmplitude: isMoving ? MOVING_PLATFORM_AMPLITUDE : 0,
                moveSpeed: isMoving ? MOVING_PLATFORM_SPEED : 0,
                movePhase: Math.random() * Math.PI * 2
            };
        }

        function platformsOverlapHorizontally(platformA, platformB) {
            const horizontalGap = 16;

            return (
                platformA.x < platformB.x + platformB.width + horizontalGap &&
                platformA.x + platformA.width + horizontalGap > platformB.x
            );
        }

        function getSafeMovingAmplitude(candidate, excludedPlatform = null) {
            const verticalGap = 14;
            let safeAmplitude = candidate.moveAmplitude;

            platforms.forEach(platform => {
                if (platform === excludedPlatform || !platformsOverlapHorizontally(candidate, platform)) {
                    return;
                }

                const otherAmplitude = platform.isMoving ? platform.moveAmplitude : 0;
                const otherBaseY = platform.baseY ?? platform.y;

                if (candidate.baseY <= otherBaseY) {
                    const allowedAmplitude = otherBaseY - otherAmplitude - (candidate.baseY + candidate.height + verticalGap);
                    safeAmplitude = Math.min(safeAmplitude, allowedAmplitude);
                } else {
                    const allowedAmplitude = candidate.baseY - (otherBaseY + platform.height + otherAmplitude + verticalGap);
                    safeAmplitude = Math.min(safeAmplitude, allowedAmplitude);
                }
            });

            return Math.max(0, safeAmplitude);
        }

        function configurePlatformMotion(platform, excludedPlatform = null) {
            if (!platform.isMoving) {
                platform.moveAmplitude = 0;
                return platform;
            }

            const safeAmplitude = getSafeMovingAmplitude(platform, excludedPlatform);

            if (safeAmplitude < 8) {
                platform.isMoving = false;
                platform.moveAmplitude = 0;
                platform.moveSpeed = 0;
            } else {
                platform.moveAmplitude = Math.min(platform.moveAmplitude, safeAmplitude);
            }

            return platform;
        }

        function maybeSpawnEnemy(platform) {
            if (!platform.isMoving && !platform.isCrackingPlatform && getRandomEnemyChance()) {
                enemies.push(createEnemy(platform));
            }
        }

        function maybeSpawnStar(platform) {
            const hasEnemy = enemies.some(enemy => enemy.platformId === platform.id);
            const hasSpring = springs.some(spring => spring.platformId === platform.id);
            if (!platform.isMoving && !platform.isCrackingPlatform && !hasEnemy && !hasSpring && Math.random() < STAR_PLATFORM_CHANCE) {
                stars.push(createStar(platform));
            }
        }

        function maybeSpawnSpring(platform) {
            const hasEnemy = enemies.some(enemy => enemy.platformId === platform.id);
            const hasStar = stars.some(star => star.platformId === platform.id);
            if (!platform.isMoving && !platform.isCrackingPlatform && !hasEnemy && !hasStar && Math.random() < SPRING_PLATFORM_CHANCE) {
                springs.push(createSpring(platform));
            }
        }

        function maybeSpawnDiamond(platform) {
            if (diamonds.some(diamond => diamond.platformId === platform.id)) {
                return;
            }

            if (Math.random() < DIAMOND_PLATFORM_CHANCE) {
                diamonds.push(createDiamond(platform));
            }
        }

        // Treat nearby platforms as overlapping as well, so jumps stay readable.
        function platformsOverlap(platformA, platformB) {
            const verticalGap = 14;

            return (
                platformsOverlapHorizontally(platformA, platformB) &&
                platformA.y < platformB.y + platformB.height + verticalGap &&
                platformA.y + platformA.height + verticalGap > platformB.y
            );
        }

        function collidesWithExistingPlatforms(candidate, excludedPlatform = null) {
            return platforms.some(platform =>
                platform !== excludedPlatform && platformsOverlap(candidate, platform)
            );
        }

        // Try a handful of random positions inside the allowed range until one fits.
        // If the row is too crowded, move the platform slightly upward and retry there.
        function createPlacedPlatform(y, minX, maxX, excludedPlatform = null, width = getRandomPlatformWidth()) {
            const safeMinX = clamp(minX, 0, canvas.width - width);
            const safeMaxX = clamp(maxX, safeMinX, canvas.width - width);
            const maxPositionAttempts = 25;
            const maxRowAdjustments = 4;
            const rowShift = Math.max(18, getPlatformHeight() + 8);

            for (let rowAttempt = 0; rowAttempt < maxRowAdjustments; rowAttempt++) {
                const adjustedY = y - (rowAttempt * rowShift);

                for (let attempt = 0; attempt < maxPositionAttempts; attempt++) {
                    const nextX = safeMinX + Math.random() * Math.max(1, safeMaxX - safeMinX);
                    const candidate = configurePlatformMotion(
                        createPlatform(nextX, adjustedY, width),
                        excludedPlatform
                    );

                    if (!collidesWithExistingPlatforms(candidate, excludedPlatform)) {
                        return candidate;
                    }
                }
            }

            return configurePlatformMotion(
                createPlatform(safeMinX, y, width),
                excludedPlatform
            );
        }

        // Place a platform anywhere across the screen, leaving some side padding.
        function createRandomPlatform(y, excludedPlatform = null) {
            const width = getRandomPlatformWidth();
            const horizontalPadding = getPlatformHorizontalPadding();
            const minX = horizontalPadding;
            const maxX = Math.max(horizontalPadding, canvas.width - width - horizontalPadding);

            return createPlacedPlatform(y, minX, maxX, excludedPlatform, width);
        }

        // Place the next platform near the previous one so the jump is still possible.
        function createReachableRandomPlatform(fromPlatform, y, excludedPlatform = null) {
            const width = getRandomPlatformWidth();
            const horizontalPadding = getPlatformHorizontalPadding();
            const maxStep = getMaxHorizontalStep();
            const minX = Math.max(horizontalPadding, fromPlatform.x - maxStep);
            const maxX = Math.min(
                canvas.width - width - horizontalPadding,
                fromPlatform.x + maxStep
            );

            return createPlacedPlatform(y, minX, maxX, excludedPlatform, width);
        }

        function recyclePlatform(platform) {
            const topmostPlatform = platforms.reduce((topmost, current) => {
                if (current === platform) {
                    return topmost;
                }

                if (!topmost || current.y < topmost.y) {
                    return current;
                }

                return topmost;
            }, null);

            const nextY = topmostPlatform
                ? topmostPlatform.y - getPlatformVerticalGap()
                : canvas.height - 40;
            const referencePlatform = topmostPlatform ?? createPlatform(player.x, canvas.height - 40, getPlatformWidth(), { isMoving: false });
            const nextPlatform = createReachableRandomPlatform(referencePlatform, nextY, platform);

            // Remove associated enemy BEFORE changing platform ID
            const oldPlatformId = platform.id;
            enemies = enemies.filter(enemy => enemy.platformId !== oldPlatformId);
            stars = stars.filter(star => star.platformId !== oldPlatformId);
            springs = springs.filter(spring => spring.platformId !== oldPlatformId);
            diamonds = diamonds.filter(diamond => diamond.platformId !== oldPlatformId);

            platform.x = nextPlatform.x;
            platform.y = nextPlatform.y;
            platform.baseY = nextPlatform.baseY;
            platform.previousY = nextPlatform.previousY;
            platform.width = nextPlatform.width;
            platform.height = nextPlatform.height;
            platform.timeOnPlatform = 0;
            platform.isFalling = false;
            platform.fallVelocity = 0;
            platform.isMoving = nextPlatform.isMoving;
            platform.isCrackingPlatform = nextPlatform.isCrackingPlatform;
            platform.crackStarted = false;
            platform.crackStartTime = 0;
            platform.crackProgress = 0;
            platform.moveAmplitude = nextPlatform.moveAmplitude;
            platform.moveSpeed = nextPlatform.moveSpeed;
            platform.movePhase = nextPlatform.movePhase;
            platformCounter++;
            platform.id = platformCounter;

            maybeSpawnEnemy(platform);
            maybeSpawnStar(platform);
            maybeSpawnSpring(platform);
            maybeSpawnDiamond(platform);
        }

        function generatePlatforms() {
            platforms = [];
            enemies = [];
            stars = [];
            springs = [];
            diamonds = [];
            const platformCount = getPlatformCount();
            const firstPlatformY = canvas.height - 40;
            const firstPlatformX = player.x - getPlatformWidth() / 2 + player.width / 2;
            const firstPlatform = createPlatform(firstPlatformX, firstPlatformY, getPlatformWidth(), {
                isMoving: false,
                isCrackingPlatform: false
            });
            platformCounter++;
            firstPlatform.id = platformCounter;
            platforms.push(firstPlatform);
            lastLandedPlatform = firstPlatform; // Initialize so first landing doesn't award points

            // Build upward one platform at a time, keeping each new one within jump range.
            let previousPlatform = firstPlatform;
            for (let i = 1; i < platformCount; i++) {
                const nextY = firstPlatformY - (getPlatformVerticalGap() * i);
                const nextPlatform = createReachableRandomPlatform(previousPlatform, nextY);
                platformCounter++;
                nextPlatform.id = platformCounter;
                platforms.push(nextPlatform);
                maybeSpawnEnemy(nextPlatform);
                maybeSpawnStar(nextPlatform);
                maybeSpawnSpring(nextPlatform);
                maybeSpawnDiamond(nextPlatform);

                previousPlatform = nextPlatform;
            }
        }

        function updateMovingPlatforms() {
            platforms.forEach(platform => {
                platform.previousY = platform.y;

                if (platform.isFalling) {
                    platform.baseY = platform.y;
                    return;
                }

                if (platform.isMoving) {
                    platform.movePhase += platform.moveSpeed;
                    platform.y = platform.baseY + Math.sin(platform.movePhase) * platform.moveAmplitude;
                } else {
                    platform.y = platform.baseY;
                }
            });
        }

        function updateCrackingPlatforms() {
            const now = performance.now();

            platforms.forEach(platform => {
                if (!platform.isCrackingPlatform || !platform.crackStarted || platform.isFalling) {
                    return;
                }

                const elapsed = now - platform.crackStartTime;
                platform.crackProgress = clamp(elapsed / CRACKING_PLATFORM_DURATION_MS, 0, 1);

                if (elapsed >= CRACKING_PLATFORM_DURATION_MS) {
                    platform.isFalling = true;
                    platform.fallVelocity = Math.max(platform.fallVelocity, INITIAL_PLATFORM_FALL_VELOCITY);

                    if (platform === currentPlatform) {
                        currentPlatform = null;
                        player.jumping = true;
                        player.y -= 2;
                        player.velY = Math.max(player.velY, 1.5);
                    }
                }
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (!sceneInitialized) {
                player.x = canvas.width / 2 - player.width / 2;
                player.y = canvas.height - 150;
                sceneInitialized = true;
            } else {
                player.x = clamp(player.x, 0, canvas.width - player.width);
                player.y = clamp(player.y, 0, canvas.height - player.height);
            }

            generatePlatforms();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Key Listener
        let keys = [];
        window.addEventListener('keydown', function(e) {
            keys[e.keyCode] = true;
            if (e.keyCode === 32 && !player.jumping) {
                triggerJump('keyboard');
            }
        });

        window.addEventListener('keyup', function(e) {
            keys[e.keyCode] = false;
        });

        function updateEnemies() {
            enemies = enemies.filter(enemy => {
                const basePlatform = platforms.find(p => p.id === enemy.platformId);
                // Remove enemies whose platform is no longer on screen
                return basePlatform && basePlatform.y < canvas.height;
            });

            enemies.forEach(enemy => {
                const basePlatform = platforms.find(p => p.id === enemy.platformId);
                if (!basePlatform) return;

                // Update enemy position with platform
                enemy.y = basePlatform.y - enemy.height - 5;

                if (enemy.type === 2) {
                    // Type2: Move side to side
                    enemy.x += enemy.direction * enemy.speed;

                    // Bounce at edges of platform
                    if (enemy.x <= basePlatform.x || enemy.x + enemy.width >= basePlatform.x + basePlatform.width) {
                        enemy.direction *= -1;
                    }
                } else if (enemy.type === 3) {
                    // Type3: Only shoot if player is on the same platform
                    if (currentPlatform && currentPlatform.id === enemy.platformId) {
                        enemy.shootTimer++;
                        if (enemy.shootTimer >= enemy.shootInterval) {
                            // Fire bullet towards player
                            const playerCenterX = player.x + player.width / 2;
                            const playerCenterY = player.y + player.height / 2;
                            const enemyCenterX = enemy.x + enemy.width / 2;
                            const enemyCenterY = enemy.y + enemy.height / 2;
                            
                            bullets.push(createBullet(enemyCenterX, enemyCenterY, playerCenterX, playerCenterY));
                            enemy.shootTimer = 0;
                        }
                    } else {
                        // Reset timer when player is not on platform
                        enemy.shootTimer = 0;
                    }
                }
            });
        }

        function updateStars() {
            stars = stars.filter(star => {
                const basePlatform = platforms.find(platform => platform.id === star.platformId);

                if (!basePlatform || basePlatform.y >= canvas.height) {
                    return false;
                }

                star.x = basePlatform.x + basePlatform.width / 2 - star.width / 2;
                star.y = basePlatform.y - star.height - 18;
                return true;
            });
        }

        function updateSprings() {
            springs = springs.filter(spring => {
                const basePlatform = platforms.find(platform => platform.id === spring.platformId);

                if (!basePlatform || basePlatform.y >= canvas.height) {
                    return false;
                }

                spring.x = basePlatform.x + basePlatform.width / 2 - spring.width / 2;
                spring.y = basePlatform.y - spring.height - 18;
                return true;
            });
        }

        function updateDiamonds() {
            diamonds = diamonds.filter(diamond => {
                const basePlatform = platforms.find(platform => platform.id === diamond.platformId);

                if (!basePlatform || basePlatform.y >= canvas.height) {
                    return false;
                }

                const horizontalPadding = Math.max(8, diamond.width * 0.2);
                const availableWidth = Math.max(0, basePlatform.width - diamond.width - (horizontalPadding * 2));
                diamond.x = basePlatform.x + horizontalPadding + (availableWidth * diamond.offsetRatio);
                diamond.y = basePlatform.y - diamond.height - 24;
                return true;
            });
        }

        function updateStormSnowflake() {
            const now = Date.now();

            if (!fallingStormSnowflake && gameState === 'playing' && now >= nextStormSnowflakeTime) {
                fallingStormSnowflake = createStormSnowflake();
            }

            if (!fallingStormSnowflake) {
                return;
            }

            fallingStormSnowflake.y += STORM_SNOWFLAKE_SPEED_Y;
            fallingStormSnowflake.zigzagPhase += STORM_SNOWFLAKE_ZIGZAG_SPEED;
            fallingStormSnowflake.x = fallingStormSnowflake.baseX + Math.sin(fallingStormSnowflake.zigzagPhase) * STORM_SNOWFLAKE_ZIGZAG_AMPLITUDE;

            if (fallingStormSnowflake.y > canvas.height + fallingStormSnowflake.height) {
                fallingStormSnowflake = null;
                scheduleNextStormSnowflake();
            }
        }

        function updatePowerUpState() {
            if (playerPoweredUp && Date.now() >= powerUpEndTime) {
                playerPoweredUp = false;
                powerUpEndTime = 0;
            }
        }

        function updateDiamondBoostState() {
            if (diamondBoostActive && performance.now() >= diamondBoostEndTime) {
                diamondBoostActive = false;
            }
        }

        function checkStarCollision() {
            stars = stars.filter(star => {
                const isColliding =
                    player.x < star.x + star.width &&
                    player.x + player.width > star.x &&
                    player.y < star.y + star.height &&
                    player.y + player.height > star.y;

                if (isColliding) {
                    playerPoweredUp = true;
                    powerUpEndTime = Date.now() + POWER_UP_DURATION_MS;
                    playSound(starPickupSound);
                    return false;
                }

                return true;
            });
        }

        function checkSpringCollision() {
            springs = springs.filter(spring => {
                const isColliding =
                    player.x < spring.x + spring.width &&
                    player.x + player.width > spring.x &&
                    player.y < spring.y + spring.height &&
                    player.y + player.height > spring.y;

                if (isColliding) {
                    playerHasBoostedJump = true;
                    return false;
                }

                return true;
            });
        }

        function triggerDiamondSuperJump() {
            diamondCount = 0;
            diamondBoostActive = true;
            diamondBoostStartTime = performance.now();
            diamondBoostEndTime = diamondBoostStartTime + DIAMOND_SUPER_JUMP_DURATION_MS;
            currentPlatform = null;
            player.jumping = true;
            player.y -= 8;
            player.velY = getDiamondSuperJumpVelocity();
            playSound(woohooSound);
        }

        function checkDiamondCollision() {
            diamonds = diamonds.filter(diamond => {
                const isColliding =
                    player.x < diamond.x + diamond.width &&
                    player.x + player.width > diamond.x &&
                    player.y < diamond.y + diamond.height &&
                    player.y + player.height > diamond.y;

                if (isColliding) {
                    diamondCount++;
                    playSound(diamondPickupSound);

                    if (diamondCount >= DIAMOND_TARGET_COUNT) {
                        triggerDiamondSuperJump();
                    }

                    return false;
                }

                return true;
            });
        }

        function checkStormSnowflakeCollision() {
            if (!fallingStormSnowflake) {
                return;
            }

            if (
                player.x < fallingStormSnowflake.x + fallingStormSnowflake.width &&
                player.x + player.width > fallingStormSnowflake.x &&
                player.y < fallingStormSnowflake.y + fallingStormSnowflake.height &&
                player.y + player.height > fallingStormSnowflake.y
            ) {
                fallingStormSnowflake = null;
                scheduleNextStormSnowflake();
                endGame("The snow storm caught you!");
            }
        }

        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.velX;
                bullet.y += bullet.velY;
                // Remove bullets that go off screen
                return bullet.x > -10 && bullet.x < canvas.width + 10 && 
                       bullet.y > -10 && bullet.y < canvas.height + 10;
            });
        }

        function checkBulletCollision() {
            bullets = bullets.filter(bullet => {
                if (
                    player.x < bullet.x + bullet.width &&
                    player.x + player.width > bullet.x &&
                    player.y < bullet.y + bullet.height &&
                    player.y + player.height > bullet.y
                ) {
                    if (!playerPoweredUp) {
                        endGame("You got hit by a bullet!");
                    }
                    return false; // Remove this bullet
                }
                return true; // Keep this bullet
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                const enemyImage = enemy.type === 3 ? enemyWithGunImage : enemyNoGunImage;
                const spriteX = enemy.x - (ENEMY_SPRITE_SIZE - enemy.width) / 2;
                const spriteY = enemy.y - (ENEMY_SPRITE_SIZE - enemy.height);

                if (enemyImage.complete && enemyImage.naturalWidth > 0) {
                    ctx.drawImage(
                        enemyImage,
                        spriteX,
                        spriteY,
                        ENEMY_SPRITE_SIZE,
                        ENEMY_SPRITE_SIZE
                    );
                } else {
                    ctx.fillStyle = enemy.type === 1 ? '#FF6B6B' : enemy.type === 2 ? '#FFA500' : '#FFD700';
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width / 2, enemy.y);
                    ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height);
                    ctx.lineTo(enemy.x, enemy.y + enemy.height);
                    ctx.closePath();
                    ctx.fill();
                }
            });
        }

        function drawBullets() {
            bullets.forEach(bullet => {
                const spriteX = bullet.x - (BULLET_SPRITE_SIZE - bullet.width) / 2;
                const spriteY = bullet.y - (BULLET_SPRITE_SIZE - bullet.height) / 2;

                if (bulletImage.complete && bulletImage.naturalWidth > 0) {
                    ctx.drawImage(
                        bulletImage,
                        spriteX,
                        spriteY,
                        BULLET_SPRITE_SIZE,
                        BULLET_SPRITE_SIZE
                    );
                } else {
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, bullet.width, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawStars() {
            stars.forEach(star => {
                const pulse = 1 + Math.sin(Date.now() / 180) * 0.08;
                const bobOffset = Math.sin(Date.now() / 260) * 4;
                const drawWidth = star.width * pulse;
                const drawHeight = star.height * pulse;
                const drawX = star.x - (drawWidth - star.width) / 2;
                const drawY = star.y - (drawHeight - star.height) / 2 + bobOffset;

                ctx.save();
                ctx.shadowColor = 'rgba(220, 245, 255, 0.95)';
                ctx.shadowBlur = 14 + ((pulse - 1) * 40);

                if (starPowerupImage.complete && starPowerupImage.naturalWidth > 0) {
                    ctx.drawImage(
                        starPowerupImage,
                        drawX,
                        drawY,
                        drawWidth,
                        drawHeight
                    );
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(drawX + drawWidth / 2, drawY + drawHeight / 2, drawWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        function drawSprings() {
            springs.forEach(spring => {
                const pulse = 1 + Math.sin(Date.now() / 210) * 0.06;
                const bobOffset = Math.sin(Date.now() / 280) * 4;
                const drawWidth = spring.width * pulse;
                const drawHeight = spring.height * pulse;
                const drawX = spring.x - (drawWidth - spring.width) / 2;
                const drawY = spring.y - (drawHeight - spring.height) / 2 + bobOffset;

                ctx.save();
                ctx.shadowColor = 'rgba(220, 240, 255, 0.95)';
                ctx.shadowBlur = 18 + ((pulse - 1) * 50);

                if (springPowerupImage.complete && springPowerupImage.naturalWidth > 0) {
                    ctx.drawImage(
                        springPowerupImage,
                        drawX,
                        drawY,
                        drawWidth,
                        drawHeight
                    );
                } else {
                    ctx.fillStyle = '#dfe8f3';
                    ctx.fillRect(drawX, drawY, drawWidth, drawHeight);
                }

                ctx.restore();
            });
        }

        function drawDiamonds() {
            diamonds.forEach(diamond => {
                const pulse = 1 + Math.sin(Date.now() / 200) * 0.09;
                const bobOffset = Math.sin(Date.now() / 250) * 5;
                const drawWidth = diamond.width * pulse;
                const drawHeight = diamond.height * pulse;
                const drawX = diamond.x - (drawWidth - diamond.width) / 2;
                const drawY = diamond.y - (drawHeight - diamond.height) / 2 + bobOffset;

                ctx.save();
                ctx.shadowColor = 'rgba(225, 245, 255, 0.95)';
                ctx.shadowBlur = 18 + ((pulse - 1) * 50);

                if (diamondPowerupImage.complete && diamondPowerupImage.naturalWidth > 0) {
                    ctx.drawImage(
                        diamondPowerupImage,
                        drawX,
                        drawY,
                        drawWidth,
                        drawHeight
                    );
                } else {
                    ctx.fillStyle = '#dff6ff';
                    ctx.beginPath();
                    ctx.arc(drawX + drawWidth / 2, drawY + drawHeight / 2, drawWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        function drawStormSnowflake() {
            if (!fallingStormSnowflake) {
                return;
            }

            if (stormSnowflakeImage.complete && stormSnowflakeImage.naturalWidth > 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(210, 238, 255, 0.55)';
                ctx.shadowBlur = 18;
                ctx.drawImage(
                    stormSnowflakeImage,
                    fallingStormSnowflake.x,
                    fallingStormSnowflake.y,
                    fallingStormSnowflake.width,
                    fallingStormSnowflake.height
                );
                ctx.restore();
            } else {
                ctx.fillStyle = '#dcefff';
                ctx.beginPath();
                ctx.arc(
                    fallingStormSnowflake.x + (fallingStormSnowflake.width / 2),
                    fallingStormSnowflake.y + (fallingStormSnowflake.height / 2),
                    fallingStormSnowflake.width / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
        }

        function checkEnemyCollision() {
            enemies = enemies.filter(enemy => {
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    if (playerPoweredUp) {
                        bullets = bullets.filter(bullet => {
                            const enemyPlatform = platforms.find(platform => platform.id === enemy.platformId);
                            return !enemyPlatform || bullet.y < enemyPlatform.y - 20;
                        });
                        return false;
                    }

                    playSound(enemyHitSound);
                    endGame("You hit an enemy!", { delayGameOverSoundMs: 280 });
                }
                return true;
            });
        }

        function resetGame() {
            if (pendingGameOverSoundTimeout) {
                clearTimeout(pendingGameOverSoundTimeout);
                pendingGameOverSoundTimeout = 0;
            }
            if (recordCheerTimeout) {
                clearTimeout(recordCheerTimeout);
                recordCheerTimeout = 0;
            }
            recordCheerSound.pause();
            recordCheerSound.currentTime = 0;

            // Reset player
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 150;
            player.velX = 0;
            player.velY = 0;
            player.jumping = false;

            // Reset score and state
            score = 0;
            lastLandedPlatform = null; // Will be set to first platform in generatePlatforms
            currentPlatform = null;
            gameState = "playing";
            platformCounter = 0;
            playerPoweredUp = false;
            powerUpEndTime = 0;
            playerHasBoostedJump = false;
            diamondCount = 0;
            diamondBoostActive = false;
            diamondBoostStartTime = 0;
            diamondBoostEndTime = 0;
            hasShownRecordToastThisRun = false;
            fallingStormSnowflake = null;
            scheduleNextStormSnowflake();
            resetHandControlState();
            resetTouchInputState();
            keys = [];

            // Clear platforms and enemies
            platforms = [];
            enemies = [];
            bullets = [];
            stars = [];
            springs = [];
            diamonds = [];

            // Generate new platforms
            generatePlatforms();

            // Hide game over screen
            document.getElementById('gameOverScreen').classList.remove('show');
            updateTouchControlsVisibility();
        }

        function endGame(message, options = {}) {
            const delayGameOverSoundMs = options.delayGameOverSoundMs ?? 0;
            const playGameOverAudio = options.playGameOverAudio ?? true;
            gameState = "gameOver";
            stopBackgroundMusic();
            if (pendingGameOverSoundTimeout) {
                clearTimeout(pendingGameOverSoundTimeout);
                pendingGameOverSoundTimeout = 0;
            }
            const scoreUpdate = addScoreToBestScores(score);
            document.getElementById('gameOverMessage').textContent = message;
            renderBestScores(scoreUpdate.bestScores);
            document.getElementById('gameOverScreen').classList.add('show');
            updateTouchControlsVisibility();

            if (playGameOverAudio) {
                pendingGameOverSoundTimeout = window.setTimeout(() => {
                    if (gameState === 'gameOver') {
                        playSound(gameOverSound);
                    }
                    pendingGameOverSoundTimeout = 0;
                }, delayGameOverSoundMs);
            }
        }

        function updateGame() {
            if (gameState !== "playing") return;

            let landedPlatform = null;
            const movementInput = getResolvedMovementInput();

            if (currentControlMode === 'camera' && handControlState.bothRaised) {
                triggerJump('camera');
            }

            // Horizontal movement input
            if (movementInput.right) { // right
                const acceleration = movementInput.cameraControlled
                    ? CAMERA_MOVE_ACCELERATION
                    : movementInput.touchControlled
                        ? TOUCH_MOVE_ACCELERATION
                        : 1;
                const maxSpeed = movementInput.cameraControlled
                    ? CAMERA_MOVE_MAX_SPEED
                    : movementInput.touchControlled
                        ? TOUCH_MOVE_MAX_SPEED
                        : player.speed;
                if (player.velX < maxSpeed) {
                    player.velX += acceleration;
                }
            }

            if (movementInput.left) { // left
                const acceleration = movementInput.cameraControlled
                    ? CAMERA_MOVE_ACCELERATION
                    : movementInput.touchControlled
                        ? TOUCH_MOVE_ACCELERATION
                        : 1;
                const maxSpeed = movementInput.cameraControlled
                    ? CAMERA_MOVE_MAX_SPEED
                    : movementInput.touchControlled
                        ? TOUCH_MOVE_MAX_SPEED
                        : player.speed;
                if (player.velX > -maxSpeed) {
                    player.velX -= acceleration;
                }
            }

            player.velX *= friction;
            player.velY += gravity;

            player.x += player.velX;
            player.y += player.velY;

            // Check if player fell off the bottom
            if (player.y > canvas.height) {
                endGame("You slipped off the cliff!");
                return;
            }

            // Screen scroll
            if (player.y < canvas.height / 4) {
                const scrollAmount = Math.abs(player.velY);
                player.y += scrollAmount;

                platforms.forEach(platform => {
                    platform.y += scrollAmount;
                    platform.baseY += scrollAmount;
                    platform.previousY += scrollAmount;

                    if (platform.y > canvas.height) {
                        recyclePlatform(platform);
                    }
                });
            }

            // Canvas edges
            if (player.x >= canvas.width - player.width) {
                player.x = canvas.width - player.width;
                player.velX = 0;
            } else if (player.x <= 0) {
                player.x = 0;
                player.velX = 0;
            }

            updatePowerUpState();
            updateDiamondBoostState();
            updateMovingPlatforms();
            updateCrackingPlatforms();
            updateStars();
            updateSprings();
            updateDiamonds();
            updateStormSnowflake();

            // Platform collision
            platforms.forEach(platform => {
                if (
                    !platform.isFalling &&
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height &&
                    player.velY >= 0
                ) {
                    landedPlatform = platform;
                }
            });

            if (landedPlatform) {
                const isFreshLanding = currentPlatform !== landedPlatform;
                player.jumping = false;
                player.y = landedPlatform.y - player.height;
                player.velY = 0;
                currentPlatform = landedPlatform; // Track current platform

                if (isFreshLanding) {
                    playSound(landingSound);
                }

                if (landedPlatform.isCrackingPlatform && !landedPlatform.crackStarted) {
                    landedPlatform.crackStarted = true;
                    landedPlatform.crackStartTime = performance.now();
                    landedPlatform.crackProgress = 0;
                }
                
                // Award points only when landing on a new platform that is higher up
                if (lastLandedPlatform !== landedPlatform) {
                    // Only award points if moving to a higher platform (lower Y value)
                    if (!lastLandedPlatform || landedPlatform.y < lastLandedPlatform.y) {
                        const basePoints = 2;
                        const velocityBonus = Math.floor(Math.abs(player.velY));
                        const pointsEarned = basePoints + velocityBonus;
                        score += pointsEarned;

                        if (!hasShownRecordToastThisRun) {
                            const previousPositiveScores = loadBestScores().filter(savedScore => savedScore > 0);
                            const currentBest = previousPositiveScores[0] ?? 0;
                            if (previousPositiveScores.length > 0 && score > currentBest) {
                                hasShownRecordToastThisRun = true;
                                showRecordToast();
                            }
                        }
                    }
                    lastLandedPlatform = landedPlatform;
                }
            } else {
                currentPlatform = null; // Player left platform
            }

            // Platform fall system
            platforms.forEach(platform => {
                if (platform === landedPlatform && !platform.isFalling) {
                    // Player is standing on this platform
                    platform.timeOnPlatform++;
                    if (platform.timeOnPlatform >= PLATFORM_FALL_DELAY_FRAMES) { // 4 seconds at 60 FPS
                        platform.isFalling = true;
                        platform.fallVelocity = INITIAL_PLATFORM_FALL_VELOCITY;

                        if (platform === currentPlatform) {
                            currentPlatform = null;
                            player.jumping = true;
                            player.y -= 2;
                            player.velY = Math.max(player.velY, 1.5);
                        }
                    }
                } else if (platform !== landedPlatform) {
                    // Player left this platform, reset timer
                    platform.timeOnPlatform = 0;
                }
                
                // Make falling platforms accelerate downward
                if (platform.isFalling) {
                    platform.fallVelocity += FALLING_PLATFORM_GRAVITY;
                    platform.y += platform.fallVelocity;
                }
            });

            // Update enemies and check collisions
            updateEnemies();
            updateBullets();
            checkStarCollision();
            checkSpringCollision();
            checkDiamondCollision();
            checkStormSnowflakeCollision();
            checkEnemyCollision();
            checkBulletCollision();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player
            const activePlayerImage = playerPoweredUp
                ? (player.jumping ? playerStarBackImage : playerStarFrontImage)
                : (player.jumping ? playerBackImage : playerFrontImage);
            const spriteX = player.x - (PLAYER_SPRITE_WIDTH - player.width) / 2;
            const spriteY = player.y - (PLAYER_SPRITE_HEIGHT - player.height) - PLAYER_SPRITE_VERTICAL_OFFSET;
            const playerCenterX = spriteX + (PLAYER_SPRITE_WIDTH / 2);
            const playerCenterY = spriteY + (PLAYER_SPRITE_HEIGHT / 2);
            const diamondBoostProgress = diamondBoostActive
                ? clamp((performance.now() - diamondBoostStartTime) / DIAMOND_SUPER_JUMP_DURATION_MS, 0, 1)
                : 0;
            const rotationAngle = diamondBoostActive ? diamondBoostProgress * Math.PI * 8 : 0;

            if (activePlayerImage.complete && activePlayerImage.naturalWidth > 0) {
                ctx.save();
                ctx.translate(playerCenterX, playerCenterY);
                if (diamondBoostActive) {
                    ctx.rotate(rotationAngle);
                    ctx.shadowColor = 'rgba(219, 242, 255, 0.9)';
                    ctx.shadowBlur = 18;
                }
                ctx.drawImage(
                    activePlayerImage,
                    -PLAYER_SPRITE_WIDTH / 2,
                    -PLAYER_SPRITE_HEIGHT / 2,
                    PLAYER_SPRITE_WIDTH,
                    PLAYER_SPRITE_HEIGHT
                );
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
                if (diamondBoostActive) {
                    ctx.rotate(rotationAngle);
                }
                ctx.fillStyle = 'red';
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                ctx.restore();
            }

            // Draw platforms
            ctx.fillStyle = 'black';
            let hasLabel = false;
            platforms.forEach(platform => {
                let drawX = platform.x;
                let drawY = platform.y - (platform.height * 1.8);

                if (platform.isCrackingPlatform && platform.crackStarted && !platform.isFalling) {
                    const shakeStrength = 2 + (platform.crackProgress * 6);
                    drawX += Math.sin(Date.now() / 16 + platform.id) * shakeStrength;
                    drawY += Math.cos(Date.now() / 20 + platform.id) * (shakeStrength * 0.85);
                }

                if (platformImage.complete && platformImage.naturalWidth > 0) {
                    ctx.drawImage(
                        platformImage,
                        drawX,
                        drawY,
                        platform.width,
                        platform.height * 3
                    );
                } else {
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                }

                if (platform.isCrackingPlatform && platform.crackStarted && !platform.isFalling) {
                    const crackBaseY = platform.y - (platform.height * 0.5);
                    const crackCount = 4 + Math.floor(platform.crackProgress * 7);

                    ctx.save();
                    ctx.strokeStyle = `rgba(230, 247, 255, ${0.55 + (platform.crackProgress * 0.4)})`;
                    ctx.lineWidth = 1.6 + (platform.crackProgress * 1.6);

                    for (let crackIndex = 0; crackIndex < crackCount; crackIndex++) {
                        const horizontalStep = 0.72 / Math.max(1, crackCount - 1);
                        const startX = platform.x + (platform.width * (0.14 + crackIndex * horizontalStep));
                        const startY = crackBaseY + ((crackIndex % 3) * 4);
                        const crackDepth = 10 + (platform.crackProgress * 10);
                        const crackWidth = platform.width * (0.08 + (platform.crackProgress * 0.05));

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.lineTo(startX + crackWidth, startY + 4);
                        ctx.lineTo(startX - (crackWidth * 0.6), startY + crackDepth * 0.45);
                        ctx.lineTo(startX + (crackWidth * 1.2), startY + crackDepth);
                        if (platform.crackProgress > 0.35) {
                            ctx.lineTo(startX - (crackWidth * 0.8), startY + crackDepth * 1.25);
                        }
                        ctx.stroke();
                    }

                    ctx.strokeStyle = `rgba(90, 130, 170, ${0.25 + (platform.crackProgress * 0.35)})`;
                    ctx.lineWidth = 1 + platform.crackProgress;
                    ctx.beginPath();
                    ctx.moveTo(platform.x + (platform.width * 0.08), crackBaseY + 5);
                    ctx.lineTo(platform.x + (platform.width * 0.38), crackBaseY + 12 + (platform.crackProgress * 4));
                    ctx.lineTo(platform.x + (platform.width * 0.66), crackBaseY + 7);
                    ctx.lineTo(platform.x + (platform.width * 0.9), crackBaseY + 15 + (platform.crackProgress * 5));
                    ctx.stroke();

                    ctx.restore();
                }
                
                // Display platform label for multiples of 10
                if (platform.id % 10 === 0) {
                    hasLabel = true;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(platform.id, platform.x + platform.width / 2, platform.y + platform.height + 15);
                    ctx.fillStyle = 'black';
                    ctx.textAlign = 'left';
                }
            });
            
            // Debug: show all platform IDs
            if (!hasLabel) {
                console.log('Platform IDs:', platforms.map(p => p.id));
            }
            
            // Draw enemies
            drawEnemies();

            // Draw bullets
            drawBullets();

            // Draw stars
            drawStars();

            // Draw springs
            drawSprings();

            // Draw diamonds
            drawDiamonds();

            // Draw storm snowflake hazard
            drawStormSnowflake();

            // Draw score and diamond progress
            ctx.fillStyle = 'black';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}   Diamonds: ${diamondCount}`, 20, 40);
        }

        let lastTime = 0;
        let accumulator = 0;

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;

            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Prevent huge catch-up jumps after tab switching/freezing
            if (deltaTime > 250) deltaTime = 250;

            accumulator += deltaTime;

            while (accumulator >= FRAME_TIME) {
                updateGame();
                accumulator -= FRAME_TIME;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.getElementById('playAgainBtn').addEventListener('click', function() {
            resetGame();
            startBackgroundMusic();
        });
        startBtn.addEventListener('click', function() {
            startGameplay('keyboard');
        });
        startCameraBtn.addEventListener('click', function() {
            startWithCameraMode();
        });
        backToMenuBtn.addEventListener('click', backToMenu);
        touchLeftBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            touchInputState.left = true;
        });
        touchLeftBtn.addEventListener('pointerup', function() {
            touchInputState.left = false;
        });
        touchLeftBtn.addEventListener('pointercancel', function() {
            touchInputState.left = false;
        });
        touchLeftBtn.addEventListener('pointerleave', function() {
            touchInputState.left = false;
        });

        touchRightBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            touchInputState.right = true;
        });
        touchRightBtn.addEventListener('pointerup', function() {
            touchInputState.right = false;
        });
        touchRightBtn.addEventListener('pointercancel', function() {
            touchInputState.right = false;
        });
        touchRightBtn.addEventListener('pointerleave', function() {
            touchInputState.right = false;
        });

        touchJumpBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            triggerJump('touch');
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
