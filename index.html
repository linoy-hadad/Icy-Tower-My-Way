<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Game with Screen Scroll</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #87CEEB;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const TARGET_FPS = 60;
        const FRAME_TIME = 1000 / TARGET_FPS;

        // Game settings tuned for 30 updates/sec
        const gravity = 0.5;
        const friction = 0.8;
        const baseJump = -10;

        // Player
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 150,
            width: 20,
            height: 20,
            speed: 5,
            velX: 0,
            velY: 0,
            jumping: false
        };

        // Platforms
        let platforms = [];
        let sceneInitialized = false;
        let score = 0;
        let lastLandedPlatform = null;
        let platformCounter = 0;

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getPlatformWidth() {
            return clamp(canvas.width * 0.18, 110, 220);
        }

        function getPlatformHeight() {
            return clamp(canvas.height * 0.018, 10, 18);
        }

        function getPlatformCount() {
            return Math.max(9, Math.floor(canvas.height / 120));
        }

        function getPlatformVerticalGap() {
            return clamp(canvas.height * 0.14, 90, 130);
        }

        function getPlatformHorizontalPadding() {
            return clamp(canvas.width * 0.08, 30, 120);
        }

        function getMaxHorizontalStep() {
            return clamp(canvas.width * 0.22, 130, 260);
        }

        function createPlatform(x, y) {
            const width = getPlatformWidth();
            return {
                x: clamp(x, 0, canvas.width - width),
                y,
                width,
                height: getPlatformHeight(),
                timeOnPlatform: 0,
                isFalling: false,
                fallVelocity: 0
            };
        }

        // Treat nearby platforms as overlapping as well, so jumps stay readable.
        function platformsOverlap(platformA, platformB) {
            const horizontalGap = 16;
            const verticalGap = 14;

            return (
                platformA.x < platformB.x + platformB.width + horizontalGap &&
                platformA.x + platformA.width + horizontalGap > platformB.x &&
                platformA.y < platformB.y + platformB.height + verticalGap &&
                platformA.y + platformA.height + verticalGap > platformB.y
            );
        }

        function collidesWithExistingPlatforms(candidate, excludedPlatform = null) {
            return platforms.some(platform =>
                platform !== excludedPlatform && platformsOverlap(candidate, platform)
            );
        }

        // Try a handful of random positions inside the allowed range until one fits.
        // If the row is too crowded, move the platform slightly upward and retry there.
        function createPlacedPlatform(y, minX, maxX, excludedPlatform = null) {
            const width = getPlatformWidth();
            const safeMinX = clamp(minX, 0, canvas.width - width);
            const safeMaxX = clamp(maxX, safeMinX, canvas.width - width);
            const maxPositionAttempts = 25;
            const maxRowAdjustments = 4;
            const rowShift = Math.max(18, getPlatformHeight() + 8);

            for (let rowAttempt = 0; rowAttempt < maxRowAdjustments; rowAttempt++) {
                const adjustedY = y - (rowAttempt * rowShift);

                for (let attempt = 0; attempt < maxPositionAttempts; attempt++) {
                    const nextX = safeMinX + Math.random() * Math.max(1, safeMaxX - safeMinX);
                    const candidate = createPlatform(nextX, adjustedY);

                    if (!collidesWithExistingPlatforms(candidate, excludedPlatform)) {
                        return candidate;
                    }
                }
            }

            return createPlatform(safeMinX, y);
        }

        // Place a platform anywhere across the screen, leaving some side padding.
        function createRandomPlatform(y, excludedPlatform = null) {
            const width = getPlatformWidth();
            const horizontalPadding = getPlatformHorizontalPadding();
            const minX = horizontalPadding;
            const maxX = Math.max(horizontalPadding, canvas.width - width - horizontalPadding);

            return createPlacedPlatform(y, minX, maxX, excludedPlatform);
        }

        // Place the next platform near the previous one so the jump is still possible.
        function createReachableRandomPlatform(fromPlatform, y, excludedPlatform = null) {
            const width = getPlatformWidth();
            const horizontalPadding = getPlatformHorizontalPadding();
            const maxStep = getMaxHorizontalStep();
            const minX = Math.max(horizontalPadding, fromPlatform.x - maxStep);
            const maxX = Math.min(
                canvas.width - width - horizontalPadding,
                fromPlatform.x + maxStep
            );

            return createPlacedPlatform(y, minX, maxX, excludedPlatform);
        }

        function recyclePlatform(platform) {
            const topmostPlatform = platforms.reduce((topmost, current) => {
                if (current === platform) {
                    return topmost;
                }

                if (!topmost || current.y < topmost.y) {
                    return current;
                }

                return topmost;
            }, null);

            const nextY = topmostPlatform
                ? topmostPlatform.y - getPlatformVerticalGap()
                : canvas.height - 40;
            const referencePlatform = topmostPlatform ?? createPlatform(player.x, canvas.height - 40);
            const nextPlatform = createReachableRandomPlatform(referencePlatform, nextY, platform);

            platform.x = nextPlatform.x;
            platform.y = nextPlatform.y;
            platform.width = nextPlatform.width;
            platform.height = nextPlatform.height;
            platform.timeOnPlatform = 0;
            platform.isFalling = false;
            platform.fallVelocity = 0;
            platformCounter++;
            platform.id = platformCounter;
        }

        function generatePlatforms() {
            platforms = [];
            const platformCount = getPlatformCount();
            const firstPlatformY = canvas.height - 40;
            const firstPlatformX = player.x - getPlatformWidth() / 2 + player.width / 2;
            const firstPlatform = createPlatform(firstPlatformX, firstPlatformY);
            platformCounter++;
            firstPlatform.id = platformCounter;
            platforms.push(firstPlatform);

            // Build upward one platform at a time, keeping each new one within jump range.
            let previousPlatform = firstPlatform;
            for (let i = 1; i < platformCount; i++) {
                const nextY = firstPlatformY - (getPlatformVerticalGap() * i);
                const nextPlatform = createReachableRandomPlatform(previousPlatform, nextY);
                platformCounter++;
                nextPlatform.id = platformCounter;
                platforms.push(nextPlatform);
                previousPlatform = nextPlatform;
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            if (!sceneInitialized) {
                player.x = canvas.width / 2 - player.width / 2;
                player.y = canvas.height - 150;
                sceneInitialized = true;
            } else {
                player.x = clamp(player.x, 0, canvas.width - player.width);
                player.y = clamp(player.y, 0, canvas.height - player.height);
            }

            generatePlatforms();
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Key Listener
        let keys = [];
        window.addEventListener('keydown', function(e) {
            keys[e.keyCode] = true;
            if (e.keyCode === 32 && !player.jumping) {
                player.jumping = true;
                player.velY = baseJump - Math.abs(player.velX);
            }
        });

        window.addEventListener('keyup', function(e) {
            keys[e.keyCode] = false;
        });

        function updateGame() {
            let landedPlatform = null;
            // Horizontal movement input
            if (keys[39]) { // right
                if (player.velX < player.speed) {
                    player.velX += 1;
                }
            }

            if (keys[37]) { // left
                if (player.velX > -player.speed) {
                    player.velX -= 1;
                }
            }

            player.velX *= friction;
            player.velY += gravity;

            player.x += player.velX;
            player.y += player.velY;

            // Screen scroll
            if (player.y < canvas.height / 4) {
                const scrollAmount = Math.abs(player.velY);
                player.y += scrollAmount;

                platforms.forEach(platform => {
                    platform.y += scrollAmount;

                    if (platform.y > canvas.height) {
                        recyclePlatform(platform);
                    }
                });
            }

            // Canvas edges
            if (player.x >= canvas.width - player.width) {
                player.x = canvas.width - player.width;
                player.velX = 0;
            } else if (player.x <= 0) {
                player.x = 0;
                player.velX = 0;
            }

            // Ground collision
            if (player.y >= canvas.height - player.height) {
                player.y = canvas.height - player.height;
                player.jumping = false;
                player.velY = 0;
            }

            // Platform collision
            platforms.forEach(platform => {
                if (
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height > platform.y &&
                    player.y + player.height < platform.y + platform.height &&
                    player.velY >= 0
                ) {
                    landedPlatform = platform;
                }
            });

            if (landedPlatform) {
                player.jumping = false;
                player.velY = 0;
                player.y = landedPlatform.y - player.height;
                
                // Award points only when landing on a new platform that is higher up
                if (lastLandedPlatform !== landedPlatform) {
                    // Only award points if moving to a higher platform (lower Y value)
                    if (!lastLandedPlatform || landedPlatform.y < lastLandedPlatform.y) {
                        const basePoints = 2;
                        const velocityBonus = Math.floor(Math.abs(player.velY));
                        const pointsEarned = basePoints + velocityBonus;
                        score += pointsEarned;
                    }
                    lastLandedPlatform = landedPlatform;
                }
            }

            // Platform fall system
            platforms.forEach(platform => {
                if (platform === landedPlatform && !platform.isFalling) {
                    // Player is standing on this platform
                    platform.timeOnPlatform++;
                    if (platform.timeOnPlatform >= 240) { // 240 frames at 60fps = 4 seconds
                        platform.isFalling = true;
                    }
                } else if (platform !== landedPlatform) {
                    // Player left this platform, reset timer
                    platform.timeOnPlatform = 0;
                }
                
                // Make falling platforms accelerate downward
                if (platform.isFalling) {
                    platform.fallVelocity += gravity;
                    platform.y += platform.fallVelocity;
                }
            });
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = 'red';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw platforms
            ctx.fillStyle = 'black';
            let hasLabel = false;
            platforms.forEach(platform => {
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Display platform label for multiples of 10
                if (platform.id % 10 === 0) {
                    hasLabel = true;
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(platform.id, platform.x + platform.width / 2, platform.y + platform.height + 15);
                    ctx.fillStyle = 'black';
                    ctx.textAlign = 'left';
                }
            });
            
            // Debug: show all platform IDs
            if (!hasLabel) {
                console.log('Platform IDs:', platforms.map(p => p.id));
            }
            
            // Draw score
            ctx.fillStyle = 'black';
            ctx.font = '24px Arial';
            ctx.fillText('Score: ' + score, 20, 40);
        }

        let lastTime = 0;
        let accumulator = 0;

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;

            let deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            // Prevent huge catch-up jumps after tab switching/freezing
            if (deltaTime > 250) deltaTime = 250;

            accumulator += deltaTime;

            while (accumulator >= FRAME_TIME) {
                updateGame();
                accumulator -= FRAME_TIME;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
